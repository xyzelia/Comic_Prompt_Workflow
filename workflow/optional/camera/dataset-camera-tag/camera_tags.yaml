metadata:
  name: NovelAI Comic Camera & Framing Knowledge Base
  version: 1.0.0
  description: Curated English-only camera angle, shot size, perspective, viewpoint,
    framing, focus, camera effect, and comic layout tag knowledge base for AI-driven
    comic generation.
  last_updated: '2026-10-06'
  authoritative_source: Curated local structured tag catalog snapshot
  total_tags: 212
controlled_vocabularies:
  scopes:
    - panel
    - page
    - both
  tiers:
    core: High-frequency, foundational cinematography and comic tags essential for
      baseline scene composition.
    specialized: Specific cinematic, stylistic, or situated staging tags suited for
      distinct narrative moments.
    experimental: Niche, low-frequency, or complex multi-tag interactions requiring
      careful prompt tuning.
  reliabilities:
    high: Consistently produces the intended framing and camera perspective across
      diverse seeds and prompts.
    medium: Usually effective; may interact with complex poses, background detail,
      or character density.
    low: Sensitive to prompt weight, subject complexity, or model biases; best tested
      iteratively.
  visual_priorities:
    '1': Primary framing, shot size, POV, and focal subject target.
    '2': Camera elevation angle and subject facing orientation.
    '3': Lens projection, perspective convergence, and depth-of-field blur.
    '4': Framing crops, spatial arrangements, borders, and insets.
    '5': Optical lens flares, shutter motion lines, and camera visual effects.
    '6': Page layout structure, panel configurations, and reading order.
  axes:
    - shot_size
    - camera_angle
    - orientation
    - viewpoint
    - perspective
    - framing
    - focus
    - camera_effect
    - comic_layout
global_selection_rules:
  default_panel_budget:
    min: 2
    recommended: 3
    max: 5
  default_page_budget:
    min: 1
    recommended: 2
    max: 3
  selection_pipeline:
    - '1. Determine Scope: Decide if generating an individual panel brief or a full-page
      layout.'
    - '2. Comic Layout (Page only): Select page structure and reading direction.'
    - '3. Primary Shot Size (Panel): Select exactly one shot size defining subject
      framing range.'
    - '4. Camera Angle (Panel): Select at most one vertical elevation (e.g. from above,
      from below, straight-on).'
    - '5. Orientation / POV (Panel): Select subject facing direction or subjective
      POV.'
    - '6. Perspective & Lens (Panel): Add perspective or distortion cue if dramatic
      lens dynamic is needed.'
    - '7. Framing & Composition (Panel): Add deliberate crops, anchors, or spatial
      arrangements.'
    - '8. Focus & Depth (Panel): Add specific focal target or depth-of-field blur
      cue.'
    - '9. Camera Effects (Panel): Add motion lines, lens flare, or shutter effects
      if kinetic energy is required.'
  mutual_exclusion_axes:
    - shot_size
    - camera_angle
    - orientation
  conflict_resolution_principles:
    - 'POV Override: When a subjective viewpoint (e.g. ''pov'', ''pov hands'') is
      selected, it overrides standard third-person subject orientation. Facing subjects
      should use ''facing viewer''.'
    - 'One Primary Shot Size: Never combine contradictory shot sizes (e.g. ''full
      body'' with ''close-up'' or ''upper body'').'
    - 'One Primary Angle: Never combine contradictory vertical elevations (e.g. ''from
      above'' with ''from below'' or ''straight-on'').'
    - 'Strong Effect Limit: Cap strong distortion effects (e.g. ''fisheye'', ''dutch
      angle'', ''motion blur'', ''distortion'') to a maximum of 1-2 per panel.'
    - 'Environment vs Character Exclusions: Scenery and landscape shots exclude tight
      character close-ups unless layered through insets.'
groups:
  shot_size:
    scope: panel
    max_selected: 1
    description: Framing distance and scale of the subject relative to the frame boundary.
    tags:
      - tag: full body
        tier: core
        reliability: high
        visual_priority: 1
        description: Frames the entire character from head to toe within the scene.
        use_when:
          - Action scenes requiring full body posture or movement
          - Showcasing full character outfit or footwear
          - Establishing character physical scale in an environment
        avoid_when:
          - Subtle facial emotional expressions are the main focus
          - Close intimate conversations in compact panels
        narrative_effects:
          - Provides complete spatial awareness of the subject
          - Emphasizes stance, dynamic movement, and physical action
        source_category: composition.framing.shot_size
        post_count: 1105562
        subject_coverage: head_to_toe
        field_of_view: medium_wide
        typical_usage: action_establishing
        compatible_with:
          - from above
          - from below
          - straight-on
          - wide shot
          - isometric
          - dutch angle
        exclusive_with:
          - upper body
          - cowboy shot
          - portrait
          - close-up
          - headshot
          - head only
      - tag: upper body
        tier: core
        reliability: high
        visual_priority: 1
        description: Frames character from the waist or mid-torso upwards to the top
          of the head.
        use_when:
          - Standard conversational dialogue scenes
          - Balancing hand gestures with facial expression clarity
          - General comic storytelling panels
        avoid_when:
          - Full body martial arts or footwork actions
          - Extreme macro detail on eye or facial features
        narrative_effects:
          - Natural storytelling baseline for character interaction
          - Balances character emotion and bodily gesture
        source_category: composition.framing.shot_size
        post_count: 1043118
        subject_coverage: waist_to_head
        field_of_view: medium
        typical_usage: standard_dialogue
        compatible_with:
          - facing viewer
          - from side
          - three quarter view
          - depth of field
          - blurry background
        exclusive_with:
          - full body
          - feet only
          - lower body
          - wide shot
      - tag: cowboy shot
        tier: core
        reliability: high
        visual_priority: 1
        description: Frames character from mid-thigh up, capturing hip-level weapons,
          holsters, or hand placement.
        use_when:
          - Duel or showdown standoffs
          - Displaying belt-mounted weapons, gear, or pockets
          - Slightly broader framing than upper body without showing feet
        avoid_when:
          - Tight emotional close-ups
          - Extreme wide environmental establishing shots
        narrative_effects:
          - Conveys tension, readiness for combat, and assertive presence
          - Western and action cinematic pacing
        source_category: composition.framing.shot_size
        post_count: 738833
        subject_coverage: mid_thigh_to_head
        field_of_view: medium_wide
        typical_usage: standoff_action
        compatible_with:
          - from below
          - straight-on
          - weapon focus
          - dutch angle
        exclusive_with:
          - close-up
          - portrait
          - headshot
          - full body
      - tag: portrait
        tier: core
        reliability: high
        visual_priority: 1
        description: Frames the head and upper shoulders with high emphasis on facial
          presence.
        use_when:
          - Character introduction or emotional monologue
          - Key dialogue reveals and dramatic reactions
          - Focusing on facial expression and styling
        avoid_when:
          - Scenes emphasizing physical action or limb movement
          - Complex multi-character interactions
        narrative_effects:
          - Creates emotional intimacy and direct character connection
          - Highlights internal thoughts and psychological states
        source_category: composition.framing.shot_size
        post_count: 118108
        subject_coverage: chest_to_head
        field_of_view: medium_close
        typical_usage: character_focus
        compatible_with:
          - depth of field
          - blurry background
          - soft focus
          - lens flare
        exclusive_with:
          - full body
          - cowboy shot
          - wide shot
          - scenery
      - tag: close-up
        tier: core
        reliability: high
        visual_priority: 1
        description: Tightly frames the head, face, or a specific key subject detail
          filling most of the frame.
        use_when:
          - Intense emotional shock, realization, or epiphany
          - Highlighting subtle eye expressions, tears, or smirks
          - Dramatic reaction panels in comic pacing
        avoid_when:
          - Establishing the location or surrounding context
          - Choreographing multi-character body movements
        narrative_effects:
          - Amplifies dramatic intensity and emotional resonance
          - Forces reader attention directly onto minute nuances
        source_category: composition.framing.shot_size
        post_count: 57308
        subject_coverage: face_or_detail
        field_of_view: close
        typical_usage: dramatic_reaction
        compatible_with:
          - eye focus
          - depth of field
          - motion lines
          - dutch angle
        exclusive_with:
          - full body
          - cowboy shot
          - wide shot
          - scenery
          - very wide shot
      - tag: wide shot
        tier: core
        reliability: high
        visual_priority: 1
        description: Captures characters within their full environmental context with
          ample surrounding space.
        use_when:
          - Establishing scene location and environmental atmosphere
          - Showing distance between multiple characters
          - Battlefield or group formation overviews
        avoid_when:
          - Intimate dialogue requiring facial nuance
          - Fast-paced quick reaction beats
        narrative_effects:
          - Establishes spatial orientation, geography, and scale
          - Conveys isolation, grandeur, or vastness
        source_category: composition.framing.shot_size
        post_count: 20837
        subject_coverage: environment_and_subjects
        field_of_view: wide
        typical_usage: establishing_spatial
        compatible_with:
          - scenery
          - landscape
          - from above
          - perspective
          - atmospheric perspective
        exclusive_with:
          - close-up
          - portrait
          - headshot
          - upper body
      - tag: very wide shot
        tier: specialized
        reliability: high
        visual_priority: 1
        description: Extremely distant framing where characters appear tiny against
          an expansive landscape.
        use_when:
          - Epic scale world reveals and chapter establishing panels
          - Emphasizing overwhelming wilderness or colossal architecture
          - Conveying loneliness or journey progression across terrain
        avoid_when:
          - Any character-driven conversation or combat engagement
          - Small panels with limited resolution
        narrative_effects:
          - Subordinates the character to the immense world
          - Evokes awe, solitude, or cinematic scope
        source_category: composition.framing.shot_size
        post_count: 1964
        subject_coverage: vast_environment
        field_of_view: extreme_wide
        typical_usage: epic_establishing
        compatible_with:
          - landscape
          - scenery
          - atmospheric perspective
          - full page comic
        exclusive_with:
          - close-up
          - portrait
          - cowboy shot
          - upper body
          - full body
      - tag: scenery
        tier: core
        reliability: high
        visual_priority: 1
        description: Focuses on environmental background elements and scenery rather
          than character foreground.
        use_when:
          - Scene-setting panels without active character focus
          - Transitions between locations or time of day
          - Atmospheric mood pieces
        avoid_when:
          - Character-centric emotional beats
          - Close dialogue exchanges
        narrative_effects:
          - Grounds the reader in the world lore and mood
          - Serves as narrative breathing room between intense sequences
        source_category: composition.framing.shot_size
        post_count: 68184
        subject_coverage: environment_only
        field_of_view: wide
        typical_usage: scene_transition
        compatible_with:
          - wide shot
          - landscape
          - vanishing point
          - depth of field
        exclusive_with:
          - portrait
          - close-up
          - headshot
      - tag: landscape
        tier: core
        reliability: high
        visual_priority: 1
        description: Horizontal nature or outdoor vista framing focusing on terrain,
          sky, and horizon.
        use_when:
          - Natural environment establishing panels (mountains, oceans, forests)
          - Panoramic background vistas in horizontal panels
        avoid_when:
          - Indoor tight room dialogues
          - Close character portraits
        narrative_effects:
          - Conveys natural beauty, journey progress, and tranquility
        source_category: composition.framing.shot_size
        post_count: 9144
        subject_coverage: natural_vista
        field_of_view: panoramic_wide
        typical_usage: environment_vista
        compatible_with:
          - wide shot
          - very wide shot
          - atmospheric perspective
          - sky focus
        exclusive_with:
          - portrait
          - close-up
          - headshot
          - upper body
      - tag: still life
        tier: specialized
        reliability: medium
        visual_priority: 1
        description: Static framing of inanimate objects arranged on a surface or
          in a room.
        use_when:
          - Cutaway panels focusing on meaningful props (teacup, letter, weapon)
          - Environmental storytelling through abandoned or arranged items
        avoid_when:
          - Dynamic action or active character dialogue
        narrative_effects:
          - Imparts symbolic meaning and contemplative pacing
          - Provides narrative clues through object placement
        source_category: composition.framing.shot_size
        post_count: 9164
        subject_coverage: inanimate_objects
        field_of_view: medium_close
        typical_usage: symbolic_cutaway
        compatible_with:
          - object focus
          - depth of field
          - blurry background
        exclusive_with:
          - full body
          - cowboy shot
          - wide shot
      - tag: lower body
        tier: specialized
        reliability: high
        visual_priority: 1
        description: Frames the character from hips or waist down to feet.
        use_when:
          - Walking or running approach panels building suspense
          - Emphasizing footwork, kicking actions, or lower armor/clothing
        avoid_when:
          - Panels requiring facial expressions or dialogue delivery
        narrative_effects:
          - Builds suspense and mystery before revealing identity
          - Focuses attention on locomotion and physical stance
        source_category: composition.framing.shot_size
        post_count: 7422
        subject_coverage: waist_to_feet
        field_of_view: medium
        typical_usage: suspense_footwork
        compatible_with:
          - from below
          - motion lines
          - foot focus
        exclusive_with:
          - portrait
          - close-up
          - upper body
          - headshot
      - tag: head only
        tier: specialized
        reliability: medium
        visual_priority: 1
        description: Severely isolated framing showing only the subject's head, omitting
          neck and torso.
        use_when:
          - Surreal or disembodied head compositions
          - Peeking head cut-ins or comedic floating head motifs
        avoid_when:
          - Standard realistic comic dialogue framing
        narrative_effects:
          - Creates quirky, comedic, or uncanny visual isolation
        source_category: composition.framing.shot_size
        post_count: 3562
        subject_coverage: head_isolated
        field_of_view: tight
        typical_usage: quirky_cutin
        compatible_with:
          - cut-in
          - chibi inset
          - split crop
        exclusive_with:
