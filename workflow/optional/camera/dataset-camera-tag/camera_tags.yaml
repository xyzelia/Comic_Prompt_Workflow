          - cowboy shot
          - upper body
      - tag: headshot
        tier: specialized
        reliability: high
        visual_priority: 1
        description: Clean, framed composition focusing tightly on head and neck.
        use_when:
          - Character status panels, profile cards, or dossier graphics
