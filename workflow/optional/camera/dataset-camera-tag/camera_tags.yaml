  orientation:
    scope: panel
    max_selected: 1
    description: Horizontal subject facing direction and rotational yaw relative to
      the camera.
    tags:
      - tag: facing viewer
        tier: core
        reliability: high
        visual_priority: 2
        description: Subject is oriented directly toward the camera and reader.
        use_when:
          - Direct emotional confrontation, address, or dramatic realization
          - Introducing character appearance clearly to the audience
          - Direct eye contact moments in intimate or shocking scenes
        avoid_when:
          - Characters walking away or conversing sideways with another character
        narrative_effects:
          - Engages the reader directly, commanding full visual attention
          - Builds immediate empathetic connection or confrontational intensity
        source_category: composition.camera_angle.orientation
        post_count: 87956
        horizontal_axis: frontal
        subject_facing: forward
        yaw_degrees: '0'
        compatible_with:
          - upper body
          - portrait
          - straight-on
          - close-up
        exclusive_with:
          - from behind
          - profile
          - sideways
      - tag: from side
        tier: core
        reliability: high
        visual_priority: 2
        description: Subject viewed from a lateral side perspective.
        use_when:
          - Two-character dialogue facing each other across the frame
          - Side-scrolling locomotion, walking, running, or sword swings
          - Observational framing of ongoing character actions
        avoid_when:
          - Direct reader-address or symmetrical character portraits
        narrative_effects:
          - Establishes theatrical staging and lateral movement flow
          - Provides an observational, third-person cinematic viewpoint
        source_category: composition.camera_angle.orientation
        post_count: 291504
        horizontal_axis: lateral
        subject_facing: lateral_90deg
        yaw_degrees: '90'
        compatible_with:
          - upper body
          - full body
          - motion lines
          - side-by-side
        exclusive_with:
          - facing viewer
          - from behind
      - tag: profile
        tier: core
        reliability: high
        visual_priority: 2
        description: Strict side silhouette/profile view showing exact lateral facial
          contours.
        use_when:
