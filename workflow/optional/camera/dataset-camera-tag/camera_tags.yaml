        avoid_when:
          - Dynamic action or sweeping environment sequences
        narrative_effects:
          - Formal and clear character presentation
        source_category: composition.framing.shot_size
        post_count: 515
        subject_coverage: head_and_neck
        field_of_view: close
        typical_usage: dossier_profile
        compatible_with:
          - facing viewer
          - depth of field
          - framed
        exclusive_with:
          - full body
          - wide shot
          - cowboy shot
      - tag: feet only
        tier: specialized
        reliability: high
        visual_priority: 1
        description: Extreme downward crop framing only feet and ground contact point.
        use_when:
          - Sudden stop or step forward beat
          - Puddle stepping, crossing a threshold, or stealth creeping
        avoid_when:
          - Dialogue interactions and broad scene reveals
        narrative_effects:
          - Signals immediate movement change, arrival, or departure
        source_category: composition.framing.shot_size
        post_count: 913
        subject_coverage: feet_and_floor
        field_of_view: close_downward
        typical_usage: movement_punctuation
        compatible_with:
