          - group picture
          - framed
        exclusive_with:
          - close-up
          - headshot
          - feet only
      - tag: tachi-e
        tier: specialized
        reliability: high
        visual_priority: 1
        description: Visual novel style standing character sprite against a neutral
          or transparent background.
        use_when:
          - Dialogue cut-in overlays mimicking adventure/visual novel games
          - Character design showcase in supplementary comic pages
        avoid_when:
          - Immersive natural comic environmental panels
        narrative_effects:
