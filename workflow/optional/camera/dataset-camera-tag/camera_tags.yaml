          - three quarter view
          - full body
          - upper body
        exclusive_with:
          - scenery
          - very wide shot
  camera_angle:
    scope: panel
    max_selected: 1
    description: Vertical camera elevation and pitch angle relative to the subject.
    tags:
      - tag: from above
        tier: core
        reliability: high
        visual_priority: 2
        description: High-angle camera looking down onto the subject from an elevated
          vantage point.
        use_when:
          - Conveying vulnerability, defeat, smallness, or introspection
          - Overview of ground layouts, desks, maps, or floor combat
          - Dramatic bird's-eye perspective on emotional crisis
        avoid_when:
          - Subject is meant to look imposing, dominant, or towering
          - Standard eye-level horizontal conversational dialogue
        narrative_effects:
          - Diminishes subject scale and psychological dominance
          - Enhances vulnerability, despair, or detached surveillance feeling
        source_category: composition.camera_angle.orientation
        post_count: 126439
        vertical_axis: elevated
        camera_elevation: high_angle
        pitch_degrees: -30_to_-60
        compatible_with:
          - full body
          - upper body
          - dutch angle
          - depth of field
        exclusive_with:
          - from below
          - under shot
          - worm's eye view
          - straight-on
      - tag: from below
        tier: core
        reliability: high
        visual_priority: 2
        description: Low-angle camera tilted upwards looking up at the subject.
        use_when:
          - Heroic entrances, power reveals, and imposing antagonists
          - Emphasizing authority, dominance, monumental scale, or towering stature
          - Dynamic upward combat attacks and jumping scenes
        avoid_when:
          - Subject is helpless, cowering, or defeated
          - Flat neutral informational panels
        narrative_effects:
          - Magnifies power, heroism, menace, and commanding presence
          - Imparts dramatic grandeur and physical scale
        source_category: composition.camera_angle.orientation
        post_count: 104802
        vertical_axis: depressed
        camera_elevation: low_angle
        pitch_degrees: +30_to_+60
        compatible_with:
          - full body
          - cowboy shot
          - foreshortening
          - dutch angle
          - sky focus
        exclusive_with:
          - from above
          - high up
          - straight-on
      - tag: straight-on
        tier: core
        reliability: high
        visual_priority: 2
        description: Eye-level camera perpendicular to the subject with zero vertical
          pitch.
        use_when:
          - Neutral, grounded, and objective storytelling panels
          - Direct confrontation eye-to-eye dialogue
          - Clear informational baseline before dramatic angle shifts
        avoid_when:
          - Exaggerated verticality or dynamic overhead/underfoot action
        narrative_effects:
          - Creates direct emotional honesty and objective clarity
          - Provides an uneditorialized, eye-to-eye connection
        source_category: composition.camera_angle.orientation
        post_count: 45352
        vertical_axis: neutral
        camera_elevation: eye_level
        pitch_degrees: '0'
        compatible_with:
          - upper body
          - facing viewer
          - portrait
          - side-by-side
        exclusive_with:
          - from above
          - from below
          - high up
          - under shot
          - worm's eye view
      - tag: high up
        tier: specialized
        reliability: medium
        visual_priority: 2
        description: Extreme elevated viewpoint positioned significantly above the
          ground level.
        use_when:
          - Rooftop perches, cliff edges, or aerial observation
          - Looking down from a skyscraper or balcony into the streets below
        avoid_when:
          - Ground-level intimate dialogues
        narrative_effects:
          - Emphasizes height, vertigo, detachment, and spatial scope
        source_category: composition.camera_angle.orientation
        post_count: 309
        vertical_axis: extreme_elevated
        camera_elevation: aerial_high
        pitch_degrees: -45_to_-80
        compatible_with:
